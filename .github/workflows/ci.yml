name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # No DATABASE_URL here: the migrate step skips and the build must still succeed.
      - run: npm run build

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ADMIN_PASSWORD: ci-smoke-password
      AUTH_SECRET: ci-smoke-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-e2e-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      # The runner image already has Chrome's system libraries, so skip --with-deps
      # (its apt-get update is slow and flaky) and fetch only the headless shell.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --only-shell chromium
      # The build runs scripts/migrate.mjs first, so this also migrates the service database.
      - run: npm run build
      - run: npm run seed:demo
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
